services:
  cedar:
    image: cedardb/cedardb
    restart: unless-stopped
    cpus: ${DB_CPU_LIMIT}
    mem_limit: ${DB_MEM_LIMIT}
    environment:
      CEDAR_DB: postgres
      CEDAR_USER: postgres
      CEDAR_PASSWORD: ${ADMIN_PWD}
      GRAFANA_USER_PWD: ${GRAFANA_USER_PWD}
    env_file:
      - path: db-config/cedar/license.env
        required: false
    volumes:
      - data:/data
      - ./db-config/cedar/user_init.sh:/docker-entrypoint-initdb.d/user_init.sh
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 1s
      retries: 10
  postgres:
    image: postgres:18
    restart: unless-stopped
    cpus: ${DB_CPU_LIMIT}
    mem_limit: ${DB_MEM_LIMIT}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ADMIN_PWD}
      GRAFANA_USER_PWD: ${GRAFANA_USER_PWD}
    volumes:
      - data:/data
      - ./db-config/postgres/:/docker-entrypoint-initdb.d/
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
  grafana:
    image: grafana/grafana:13.1.0-25410206825
    restart: unless-stopped
    environment:
      GRAFANA_USER: ${GRAFANA_USER}
      GRAFANA_USER_PWD: ${GRAFANA_USER_PWD}
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 100ms
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: true
    ports:
      - 127.0.0.1:3000:3000
      - "[::1]:3000:3000"
    depends_on:
      - cedar
    volumes:
      - ./grafana:/etc/grafana/provisioning
  parser:
    build:
      context: parser
      dockerfile: Dockerfile
    volumes:
      - data:/app/data
  client:
    build:
      context: client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      cedar:
        condition: service_healthy
      parser:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DB1_CONNECTION_STRING: postgresql://postgres:${ADMIN_PWD}@cedar:5432/postgres
      DB2_CONNECTION_STRING: postgresql://postgres:${ADMIN_PWD}@postgres:5432/postgres
      GRAFANA_USER: ${GRAFANA_USER}
    volumes:
      - data:/nasdaq/data

volumes:
  data:
