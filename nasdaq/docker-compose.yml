services:
  loader:
    build:
      context: loader-cpp
      dockerfile: Dockerfile
    volumes:
      - data:/app/data
  postgres:
    image: postgres:17
    restart: unless-stopped
    cpus: 8.0
    mem_limit: 32gb
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
  cedar:
    image: cedardb/cedardb
    restart: always
    cpus: 8.0
    mem_limit: 32gb
    environment:
      CEDAR_DB: postgres
      CEDAR_USER: postgres
      CEDAR_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 1s
      retries: 10
  grafana:
    image: grafana/grafana:12.0.0
    restart: unless-stopped
    environment:
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=100ms
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - 3000:3000
    depends_on:
      - cedar
      - postgres
    volumes:
      - ./grafana:/etc/grafana/provisioning
  client:
    build:
      context: client
      dockerfile: Dockerfile
    depends_on:
      loader:
        condition: service_completed_successfully
      cedar:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - data:/nasdaq/data
  prometheus:
    image: prom/prometheus:latest
    ports:
      - 9090:9090
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cadvisor
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    depends_on:
      - postgres
      # - cedar

volumes:
  data:
