<!--
  Generic checkered racing flag. Black-and-white check fabric with a wavy
  silhouette to imply motion, and an orange (#f97316) staff to tie back to
  the CedarDB brand. Designed to read clearly at 22-28px tall in the header.
  Drop a replacement at this same path to swap it out.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50"
     role="img" aria-label="Checkered flag">
  <defs>
    <!-- Wavy flag silhouette, reused for clip + stroke -->
    <path id="flag-outline"
          d="M 12 8
             C 26 4, 40 12, 54 6
             C 64 3, 72 9, 78 7
             L 78 43
             C 72 41, 64 47, 54 44
             C 40 38, 26 46, 12 42
             Z"/>
    <clipPath id="flag-clip">
      <use href="#flag-outline"/>
    </clipPath>
    <!-- 8x8 black-and-white checker repeat. Dark cells slightly off-black
         (#1c2128) so the flag blends with the dashboard panel palette
         without losing contrast. -->
    <pattern id="check-pattern" x="0" y="0"
             width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#ffffff"/>
      <rect x="0" y="0" width="8" height="8" fill="#1c2128"/>
      <rect x="8" y="8" width="8" height="8" fill="#1c2128"/>
    </pattern>
  </defs>

  <!-- Staff (rounded rect + cap) -->
  <rect x="5" y="6" width="4" height="40" rx="1.5" fill="#f97316"/>
  <circle cx="7" cy="6" r="3" fill="#f97316"/>

  <!-- Checkered fabric, clipped to the wavy silhouette -->
  <g clip-path="url(#flag-clip)">
    <rect x="8" y="0" width="76" height="50" fill="url(#check-pattern)"/>
  </g>

  <!-- Crisp outline so the flag reads cleanly at small sizes -->
  <use href="#flag-outline" fill="none" stroke="#0d1117" stroke-width="0.8"/>
</svg>
